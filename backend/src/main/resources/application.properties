spring.application.name=demo

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/syncora_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:syncora_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:syncora_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=DEBUG

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=PT15M
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
