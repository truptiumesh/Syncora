spring.application.name=syncora

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/syncora_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:syncora_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=INFO

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=${SYNCORA_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SYNCORA_MAX_REQUEST_SIZE:11MB}
app.files.storage-dir=${SYNCORA_FILE_STORAGE_DIR:./var/syncora/uploads}
app.files.max-size=${SYNCORA_MAX_FILE_SIZE:10MB}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=PT15M
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}}
syncora.demo-seed.enabled=${SYNCORA_DEMO_SEED_ENABLED:false}
syncora.demo-seed.user-email=${SYNCORA_DEMO_SEED_USER_EMAIL:}
