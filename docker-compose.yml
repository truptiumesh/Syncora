services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: syncora_db
      POSTGRES_USER: syncora_user
      POSTGRES_PASSWORD: syncora_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncora_user -d syncora_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
